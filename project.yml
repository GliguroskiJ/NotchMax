name: NotchMax
options:
  bundleIdPrefix: com.jovan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
targets:
  NotchMax:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: Sparkle
        product: Sparkle
        embed: true
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: NotchMax
        CFBundleDisplayName: NotchMax
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "NotchMax"
        NSCalendarsFullAccessUsageDescription: "NotchMax zobrazuje tvoje nadcházející události v notchi."
        NSAppleEventsUsageDescription: "NotchMax ovládá Hudbu a Spotify (přehrávání, přeskakování skladeb, obal alba)."
        SUFeedURL: "https://github.com/GliguroskiJ/NotchMax/releases/latest/download/appcast.xml"
        SUPublicEDKey: "Ru9vfr2TEvYXdHDacuXpTbJNxUHm4/yMXaYXMYLREEA="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jovan.NotchMax
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: NO
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
